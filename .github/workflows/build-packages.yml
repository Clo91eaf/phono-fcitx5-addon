name: Check and deliver Linux packages

on:
  pull_request:
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Validate all five distributions
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      matrix: ${{ steps.metadata.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || github.ref }}
      - name: Validate version and select targets
        id: metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FULL_MATRIX: ${{ inputs.full_matrix }}
        run: |
          args=()
          if test -n "$RELEASE_TAG"; then
            args+=(--tag "$RELEASE_TAG" --default-branch "$DEFAULT_BRANCH")
          fi
          if test "$FULL_MATRIX" = true; then args+=(--full); fi
          python3 tools/ci_metadata.py "${args[@]}"

  packages:
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || github.ref }}
      - name: Download and verify the fixed core Release SDK
        run: python3 tools/fetch_core_sdk.py --prefix "$GITHUB_WORKSPACE/.sdk/phono-core"
      - name: Fetch the fixed release inference model
        if: (github.event_name == 'release' || inputs.full_matrix) && matrix.target == 'ubuntu2404'
        run: python3 tools/fetch_model.py --output "$GITHUB_WORKSPACE/.cache/models/release"
      - name: Build and test in the target distribution
        env:
          TARGET: ${{ matrix.target }}
          IMAGE: ${{ matrix.image }}
          MAX_GLIBC: ${{ matrix.max_glibc }}
          REQUIRE_MODEL: ${{ (github.event_name == 'release' || inputs.full_matrix) && matrix.target == 'ubuntu2404' }}
        run: |
          docker pull "$IMAGE"
          image_id=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')
          docker run --rm --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            -e TARGET -e MAX_GLIBC -e REQUIRE_MODEL -e "CONTAINER_DIGEST=$image_id" \
            -e "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" \
            "$image_id" bash -euc '
              bash ci/install-native-deps.sh "$TARGET"
              args=()
              if test "$REQUIRE_MODEL" = true; then
                args+=(--require-model --model-dir /workspace/.cache/models/release)
              fi
              python3 tools/ci_build_packages.py --target "$TARGET" \
                --core-prefix /workspace/.sdk/phono-core --max-glibc "$MAX_GLIBC" \
                --output "/workspace/dist/$TARGET" "${args[@]}"
            '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phono-fcitx5-addon-x86_64-${{ needs.metadata.outputs.version }}-${{ matrix.target }}
          path: dist/${{ matrix.target }}/*
          if-no-files-found: error

  upload:
    if: github.event_name == 'release'
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: phono-fcitx5-addon-x86_64-*
          merge-multiple: true
          path: dist
      - name: Upload tested packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" dist/* --clobber
